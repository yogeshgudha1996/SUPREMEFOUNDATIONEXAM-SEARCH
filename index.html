<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUPREME FOUNDATION JASWATGARH - Volunteer Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: only light;
      }

      body {
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        background: radial-gradient(circle at top left, #1d4ed8 0%, #0f172a 45%, #020617 100%);
      }

      .sparkle-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.85);
        animation: shimmer 6s linear infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translate3d(0, 0, 0) scale(0.7);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        70% {
          opacity: 0.6;
        }
        100% {
          transform: translate3d(-30px, -120vh, 0) scale(1.1);
          opacity: 0;
        }
      }

      .glass-card {
        background: linear-gradient(140deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.08));
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(18px);
        box-shadow: 0 22px 50px rgba(2, 6, 23, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }

      .input-glow:focus {
        outline: none;
        border-color: rgba(147, 197, 253, 0.9);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.22);
      }

      .btn-3d {
        transform-style: preserve-3d;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-3d:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 12px 24px rgba(14, 116, 144, 0.35);
      }

      .btn-3d:active {
        transform: translateY(1px);
      }

      .success-modal {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0.08));
        border: 1px solid rgba(255, 255, 255, 0.45);
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.48);
        animation: popup 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes popup {
        0% {
          opacity: 0;
          transform: scale(0.85) rotateX(15deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotateX(0deg);
        }
      }
    </style>
  </head>
  <body class="relative text-slate-100">
    <div class="sparkle-layer" id="sparkleLayer"></div>

    <main class="relative z-10 min-h-screen flex items-center justify-center px-4 py-10">
      <section class="glass-card w-full max-w-3xl rounded-3xl p-6 md:p-10">
        <header class="text-center mb-8">
          <p class="text-xs uppercase tracking-[0.35em] text-cyan-100/80">Volunteer Application Portal</p>
          <h1 class="text-2xl md:text-4xl font-extrabold mt-2 tracking-tight">SUPREME FOUNDATION JASWATGARH</h1>
          <p class="text-sm md:text-base text-slate-200/90 mt-3 max-w-2xl mx-auto">
            Only for those who appeared earlier in the examination of this session after August 2025.
          </p>
        </header>

        <form id="volunteerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
          <div class="md:col-span-2">
            <label class="text-sm font-semibold mb-1 block" for="name">Full Name</label>
            <input id="name" name="name" required type="text" class="input-glow w-full rounded-xl border border-white/35 bg-white/15 px-4 py-3 placeholder:text-slate-200/70" placeholder="Enter your full name" />
          </div>

          <div>
            <label class="text-sm font-semibold mb-1 block" for="mobile">Mobile Number</label>
            <input id="mobile" name="mobile" required pattern="[0-9]{10}" maxlength="10" inputmode="numeric" type="tel" class="input-glow w-full rounded-xl border border-white/35 bg-white/15 px-4 py-3 placeholder:text-slate-200/70" placeholder="10-digit mobile number" />
          </div>

          <div>
            <label class="text-sm font-semibold mb-1 block" for="rollNumber">Roll Number <span class="text-rose-200">*</span></label>
            <input id="rollNumber" name="rollNumber" required type="text" class="input-glow w-full rounded-xl border border-white/35 bg-white/15 px-4 py-3 placeholder:text-slate-200/70" placeholder="Mandatory for verification" />
          </div>

          <div>
            <label class="text-sm font-semibold mb-1 block" for="location">Location</label>
            <select id="location" name="location" required class="input-glow w-full rounded-xl border border-white/35 bg-white/15 px-4 py-3"></select>
          </div>

          <div>
            <label class="text-sm font-semibold mb-1 block" for="grade">Grade</label>
            <select id="grade" name="grade" required class="input-glow w-full rounded-xl border border-white/35 bg-white/15 px-4 py-3" disabled></select>
          </div>

          <div>
            <label class="text-sm font-semibold mb-1 block" for="subject">Subject</label>
            <select id="subject" name="subject" required class="input-glow w-full rounded-xl border border-white/35 bg-white/15 px-4 py-3" disabled></select>
          </div>

          <div>
            <label class="text-sm font-semibold mb-1 block" for="school">School</label>
            <select id="school" name="school" required class="input-glow w-full rounded-xl border border-white/35 bg-white/15 px-4 py-3" disabled></select>
          </div>

          <div class="md:col-span-2 mt-2">
            <button id="submitBtn" type="submit" class="btn-3d w-full rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 py-3 font-semibold text-white shadow-lg shadow-cyan-900/50">
              Submit Application
            </button>
            <p id="statusText" class="mt-3 text-sm text-cyan-100/90" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>

    <div id="successOverlay" class="hidden fixed inset-0 z-20 bg-slate-950/60 backdrop-blur-sm items-center justify-center p-4">
      <div class="success-modal w-full max-w-md rounded-2xl p-6 text-center text-white">
        <h2 class="text-2xl font-bold">Application Submitted Successfully</h2>
        <p class="mt-3 text-slate-100/90">Your Unique ID is:</p>
        <p id="generatedId" class="mt-2 text-3xl font-extrabold tracking-wide text-cyan-100"></p>
        <button id="closeModal" class="btn-3d mt-6 rounded-xl bg-white/20 hover:bg-white/30 px-5 py-2.5 font-semibold border border-white/40">
          Close
        </button>
      </div>
    </div>

    <script>
      const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYED_WEB_APP_ID/exec";

      const optionsData = [
        {
          location: "Jaswatgarh",
          grades: [
            {
              grade: "Grade 8",
              subjects: [
                { subject: "Mathematics", schools: ["Govt. Sr. Sec. School Jaswatgarh", "Bright Future Academy"] },
                { subject: "Science", schools: ["Govt. Adarsh School", "Shiv Public School"] },
              ],
            },
            {
              grade: "Grade 10",
              subjects: [
                { subject: "English", schools: ["Govt. Sr. Sec. School Jaswatgarh", "Rising Star School"] },
                { subject: "Social Science", schools: ["Model School Jaswatgarh", "Raj Public School"] },
              ],
            },
          ],
        },
        {
          location: "Nagaur",
          grades: [
            {
              grade: "Grade 9",
              subjects: [
                { subject: "Mathematics", schools: ["Govt. High School Nagaur", "Sunrise Public School"] },
                { subject: "Hindi", schools: ["Noble Senior School", "Rajasthan Academy"] },
              ],
            },
            {
              grade: "Grade 11",
              subjects: [
                { subject: "Physics", schools: ["Govt. Excellence School", "Scholars Valley"] },
                { subject: "Chemistry", schools: ["Vivekanand School", "Mission Convent School"] },
              ],
            },
          ],
        },
      ];

      const form = document.getElementById("volunteerForm");
      const statusText = document.getElementById("statusText");
      const submitBtn = document.getElementById("submitBtn");
      const locationEl = document.getElementById("location");
      const gradeEl = document.getElementById("grade");
      const subjectEl = document.getElementById("subject");
      const schoolEl = document.getElementById("school");
      const successOverlay = document.getElementById("successOverlay");
      const generatedIdEl = document.getElementById("generatedId");
      const closeModal = document.getElementById("closeModal");

      function addPlaceholder(selectEl, text) {
        selectEl.innerHTML = "";
        const option = document.createElement("option");
        option.value = "";
        option.textContent = text;
        option.disabled = true;
        option.selected = true;
        selectEl.appendChild(option);
      }

      function fillSelect(selectEl, list, placeholderText) {
        addPlaceholder(selectEl, placeholderText);
        list.forEach((item) => {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          selectEl.appendChild(option);
        });
        selectEl.disabled = list.length === 0;
      }

      function populateLocations() {
        fillSelect(locationEl, optionsData.map((entry) => entry.location), "Select Location");
        addPlaceholder(gradeEl, "Select Grade");
        addPlaceholder(subjectEl, "Select Subject");
        addPlaceholder(schoolEl, "Select School");
        gradeEl.disabled = true;
        subjectEl.disabled = true;
        schoolEl.disabled = true;
      }

      function getLocationData() {
        return optionsData.find((entry) => entry.location === locationEl.value);
      }

      function getGradeData() {
        const locationData = getLocationData();
        return locationData?.grades.find((entry) => entry.grade === gradeEl.value);
      }

      locationEl.addEventListener("change", () => {
        const locationData = getLocationData();
        const grades = locationData ? locationData.grades.map((item) => item.grade) : [];
        fillSelect(gradeEl, grades, "Select Grade");
        addPlaceholder(subjectEl, "Select Subject");
        addPlaceholder(schoolEl, "Select School");
        subjectEl.disabled = true;
        schoolEl.disabled = true;
      });

      gradeEl.addEventListener("change", () => {
        const gradeData = getGradeData();
        const subjects = gradeData ? gradeData.subjects.map((item) => item.subject) : [];
        fillSelect(subjectEl, subjects, "Select Subject");
        addPlaceholder(schoolEl, "Select School");
        schoolEl.disabled = true;
      });

      subjectEl.addEventListener("change", () => {
        const gradeData = getGradeData();
        const subjectData = gradeData?.subjects.find((entry) => entry.subject === subjectEl.value);
        fillSelect(schoolEl, subjectData ? subjectData.schools : [], "Select School");
      });

      closeModal.addEventListener("click", () => {
        successOverlay.classList.add("hidden");
        successOverlay.classList.remove("flex");
      });

      function showSuccess(uniqueId) {
        generatedIdEl.textContent = uniqueId;
        successOverlay.classList.remove("hidden");
        successOverlay.classList.add("flex");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusText.textContent = "Submitting your application...";
        submitBtn.disabled = true;

        const payload = {
          name: form.name.value.trim(),
          mobile: form.mobile.value.trim(),
          rollNumber: form.rollNumber.value.trim(),
          location: form.location.value,
          grade: form.grade.value,
          subject: form.subject.value,
          school: form.school.value,
        };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "Submission failed.");
          }

          statusText.textContent = "Application submitted successfully.";
          showSuccess(result.uniqueId);
          form.reset();
          populateLocations();
        } catch (error) {
          statusText.textContent = error.message || "Could not submit. Please try again.";
        } finally {
          submitBtn.disabled = false;
        }
      });

      function createSparkles() {
        const sparkleLayer = document.getElementById("sparkleLayer");
        const sparkleCount = 50;

        for (let i = 0; i < sparkleCount; i += 1) {
          const spark = document.createElement("span");
          spark.className = "sparkle";
          spark.style.left = `${Math.random() * 100}%`;
          spark.style.top = `${Math.random() * 115}%`;
          spark.style.animationDelay = `${Math.random() * 6}s`;
          spark.style.animationDuration = `${4 + Math.random() * 4}s`;
          spark.style.opacity = `${0.35 + Math.random() * 0.65}`;
          sparkleLayer.appendChild(spark);
        }
      }

      populateLocations();
      createSparkles();
    </script>
  </body>
</html>
